name: Collecter et publier

# Toutes les heures (minute 0) + déclenchement manuel disponible
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

# Évite les courses entre deux runs (un seul à la fois, le plus récent gagne)
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le repo
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lancer la collecte (génère data.json)
        run: node collector.js

      - name: Mettre à jour data.json si changé + pousser
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name "Ranpi Bot"
            git config user.email "bot@users.noreply.github.com"
            git add data.json
            git commit -m "collecte: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "COLLECTE_PUSHEE=oui"
          else
            echo "COLLECTE_PUSHEE=non (pas de changement)"
          fi
        env:
          # Token automatique fourni par GitHub, scope limited au repo courant
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Cloner
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Uploader l'artefact (racine du site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
