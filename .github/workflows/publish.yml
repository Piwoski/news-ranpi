name: Publier (collecte + deploy)

# Toutes les heures + déclenchement manuel
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Cloner
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collecte (genere data.json)
        run: node collector.js

      - name: Committer data.json si change
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name "Ranpi Bot"
            git config user.email "bot@users.noreply.github.com"
            git add data.json
            git commit -m "collecte: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Uploader artefact (racine)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deployer sur Pages
        id: deployment
        uses: actions/deploy-pages@v4
